<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">

    <header>
        <h1 th:text="${title}">Catalogue</h1>
        <a href="/" class="back">← Home</a>
    </header>

    <!-- flash message after POST/Redirect/GET -->
    <p th:if="${message}" class="flash" th:text="${message}"></p>

    <!-- filter by author -->
    <section class="card">
        <h2>Search by author</h2>
        <form method="get" th:action="@{/books}" class="row">
            <input type="text" name="author" placeholder="e.g. Bloch" th:value="${author}">
            <button type="submit">Search</button>
            <a href="/books" class="btn-secondary">Reset</a>
        </form>
    </section>

    <!-- books table -->
    <section class="card">
        <h2>Books</h2>
        <table>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Author</th>
                <th>Year</th>
            </tr>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.year}">2020</td>
            </tr>
        </table>
        <p th:if="${books.isEmpty()}" class="empty">No books found.</p>
    </section>

    <!-- add a new book -->
    <section class="card">
        <h2>Add a book</h2>
        <form method="post" th:action="@{/books}" class="row">
            <input type="text" name="title" placeholder="Title" required>
            <input type="text" name="author" placeholder="Author" required>
            <input type="number" name="year" placeholder="Year" min="1000" max="2100" required>
            <button type="submit">Add</button>
        </form>
    </section>

</div>
</body>
</html>
